name: CI

on:
  pull_request:
    branches: [astradial]
  push:
    branches: [astradial]

# CI runs ONLY on the public OSS repo: Actions are free & unlimited there.
# The private mirror consumes zero minutes (GitHub Free plan friendly).
jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    if: github.repository == 'astradial/astradial-ios-oss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (iOS Simulator)
    if: github.repository == 'astradial/astradial-ios-oss'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Resolve packages & build
        run: |
          set -o pipefail
          xcodebuild -project LinphoneApp.xcodeproj -scheme Linphone \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
